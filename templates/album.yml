# 微信表情专辑文案 —— 填完跑 check_assets.py <素材目录> --copy album.yml 校验字数
# 字数上限：ip_name 8 / ip_desc 80 / album_name 8 / album_desc 80 / copyright 10
# 含义词每条 ≤4 字、同套不得重复、条数必须等于表情图张数

ip_name: 待填形象名                    # 形象名，≤8 字（5 字内最佳），无标点无空格，须能对应到具体角色
ip_desc: 待填：它是谁 → 什么性格 → 在做什么（≤80 字）
album_name: 待填专辑名              # 专辑名，≤8 字，不与平台已有专辑重名
album_desc: 待填：这套表情覆盖哪些场景（≤80 字）
copyright: 待填署名               # ≤10 字，无注册版权就填笔名或工作室名

# 含义词：按 main_240/ 的编号顺序一一对应（这是用户在表情面板搜的词，不是画面里的台词）
meanings:
  - 开心
  - 委屈
  - 好困
  - 生气
  - 疑问
  - 收到
  - 拜托
  - 无语
  - 害羞

# 仅开通赞赏时需要，5~15 字
reward_guide_text: 待填赞赏引导语（5~15 字）

# 附加信息 —— 官方规范文档里没写，但平台提交时必填（选项见 references/platform.md）
sticker_type: 表情卡通        # 真人拍摄 / 表情截图 / 表情卡通 / 表情其他
role: 宠物/动物角色 → 猫       # 角色出现的表情数须 ≥ 总数 1/3
style: 软萌可爱, 日常          # 选 1~2 项
theme: 万能通用               # 与主题相关的表情数须 ≥ 总数一半
region_publish: 中国大陆
region_download: 中国大陆
